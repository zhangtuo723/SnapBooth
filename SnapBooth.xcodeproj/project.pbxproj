			shellScript = "set -e\nif [ \"$PLATFORM_NAME\" = \"macosx\" ] && [ \"$EFFECTIVE_PLATFORM_NAME\" = \"-maccatalyst\" ]; then\n  LIBUSB_PREFIX=/opt/homebrew/opt/libusb\n  GPHOTO_PREFIX=/opt/homebrew/opt/libgphoto2\n  if [ ! -f \"$LIBUSB_PREFIX/lib/libusb-1.0.a\" ]; then\n    echo \"error: libusb is required; install it with: brew install libusb\"\n    exit 1\n  fi\n  if [ ! -f \"$GPHOTO_PREFIX/lib/libgphoto2.dylib\" ]; then\n    echo \"error: libgphoto2 is required; install it with: brew install gphoto2\"\n    exit 1\n  fi\n  HELPER_DIR=\"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers\"\n  MIJIA_HELPER=\"$HELPER_DIR/MijiaUSBHelper\"\n  CANON_HELPER=\"$HELPER_DIR/CanonRemoteHelper\"\n  mkdir -p \"$HELPER_DIR\"\n  xcrun --sdk macosx clang -std=c17 -O2 -mmacosx-version-min=13.0 -I\"$LIBUSB_PREFIX/include/libusb-1.0\" \"$SRCROOT/Tools/MijiaUSBHelper.c\" \"$LIBUSB_PREFIX/lib/libusb-1.0.a\" -framework IOKit -framework CoreFoundation -framework Security -o \"$MIJIA_HELPER\"\n  xcrun --sdk macosx clang -std=c17 -O2 -mmacosx-version-min=13.0 -I\"$GPHOTO_PREFIX/include\" -L\"$GPHOTO_PREFIX/lib\" -Wl,-rpath,\"$GPHOTO_PREFIX/lib\" \"$SRCROOT/Tools/CanonRemoteHelper.c\" -lgphoto2 -lgphoto2_port -o \"$CANON_HELPER\"\n  codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$MIJIA_HELPER\"\n  codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$CANON_HELPER\"\nfi\n";
